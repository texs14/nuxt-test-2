<!doctype html>

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link

      rel="stylesheet"
    />
    <link

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#3B82F6', // Calm indigo/blue
                hover: '#2563EB',
              },
              'background-light': '#F9FAFB', // Neutral light surface
              'background-dark': '#1F2937',
              'card-light': '#FFFFFF',
              'card-dark': '#374151',
              'text-light-primary': '#111827',
              'text-dark-primary': '#F9FAFB',
              'text-light-muted': '#6B7280',
              'text-dark-muted': '#9CA3AF',
              'border-light': '#E5E7EB',
              'border-dark': '#4B5563',
              accent: '#14B8A6', // Calm teal

            fontFamily: {
              sans: ['Noto Sans', 'sans-serif'],
              'sans-thai': ['Noto Sans Thai', 'sans-serif'],

            borderRadius: {

    <style>

        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;

      .slider-item {
        scroll-snap-align: start;

      .slider-container::-webkit-scrollbar {

                id="antonyms-prev"

            Ссылки

            <button

            <button

          <a

    <script>
      function setupSlider(id) {
        const slider = document.getElementById(`${id}-slider`);
        const prevBtn = document.getElementById(`${id}-prev`);
        const nextBtn = document.getElementById(`${id}-next`);
        const pager = document.getElementById(`${id}-pager`);
        if (!slider) return;
        const slides = Array.from(slider.children).filter((child) =>
          child.classList.contains('slider-item')
        );
        const totalSlides = slides.length;
        if (totalSlides === 0) return;
        let currentIndex = 0;
        const slideWidth = () =>
          slides[0].offsetWidth + parseInt(window.getComputedStyle(slider).gap);
        function updateUI() {
          const currentScroll = currentIndex * slideWidth();
          slider.scrollTo({
            left: currentScroll,
            behavior: 'smooth',
          });
          if (pager) pager.textContent = `${currentIndex + 1}/${totalSlides}`;
          if (prevBtn) prevBtn.disabled = currentIndex === 0;
          if (nextBtn) nextBtn.disabled = currentIndex === totalSlides - 1;
        }
        function handleScroll() {
          const newIndex = Math.round(slider.scrollLeft / slideWidth());
          if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            updateUI();
          }
        }
        if (nextBtn)
          nextBtn.addEventListener('click', () => {
            if (currentIndex < totalSlides - 1) {
              currentIndex++;
              updateUI();
            }
          });
        if (prevBtn)
          prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
              currentIndex--;
              updateUI();
            }
          });
        let debounceTimer;
        slider.addEventListener('scroll', () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(handleScroll, 150);
        });
        slider.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextBtn.click();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevBtn.click();
          }
        });
        window.addEventListener('resize', () => {
          // Recalculate scroll position on resize
          updateUI();
        });
        updateUI();
      }
      document.addEventListener('DOMContentLoaded', () => {
        setupSlider('synonyms');
        setupSlider('antonyms');
        setupSlider('examples');
        setupSlider('links');
        const dictionaryBtn = document.getElementById('dictionary-action-btn');
        let isInDictionary = false;
        dictionaryBtn.addEventListener('click', () => {
          isInDictionary = !isInDictionary;
          if (isInDictionary) {
            dictionaryBtn.textContent = 'Удалить из словаря';
            dictionaryBtn.classList.remove('bg-accent', 'hover:bg-teal-600');
            dictionaryBtn.classList.add('bg-red-500', 'hover:bg-red-600');
          } else {
            dictionaryBtn.textContent = 'Добавить в словарь';
            dictionaryBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            dictionaryBtn.classList.add('bg-accent', 'hover:bg-teal-600');
          }
        });
      });
    </script>
